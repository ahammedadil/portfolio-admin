<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Route Protection Script (Failsafe) -->
    <script>
        if (localStorage.getItem("token")) {
            window.location.href = "index.html"; // Already logged in
        }
    </script>

    <div class="login-container">
        <div class="login-card glass-panel">
            
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>Portfolio Admin</h2>
                <p>Welcome back.<br>Sign in to continue.</p>
            </div>

            <div id="error-box" class="error-box" style="display: none;">
                <!-- Errors injected here -->
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" class="glass-input" placeholder="admin@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="glass-input" placeholder="Enter your password" required minlength="6">
                    </div>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember Me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary login-btn">
                    <span id="btn-text">Login</span>
                    <i class="fa-solid fa-arrow-right-to-bracket" id="btn-icon"></i>
                    <i class="fa-solid fa-circle-notch fa-spin" id="spinner" style="display: none;"></i>
                </button>
            </form>

        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
